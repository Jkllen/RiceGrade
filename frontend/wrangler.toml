name = "ricegrade"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "ricegrade_db"
database_id = "45448a5d-1d3d-41de-9e3f-bbf005e19569"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ricegrade-images"

# Route authenticated Pages API requests to the separately deployed model Worker.
# Binding stays private inside Cloudflare; no public model URL is required.
[[services]]
binding = "RICEGRADE_MODEL"
service = "ricegrade-model"


